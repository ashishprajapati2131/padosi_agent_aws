<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - PadosiAgent</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
        font-family: 'Outfit', sans-serif;
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at 10% 20%, rgb(240, 247, 255) 0%, rgb(255, 255, 255) 90%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .premium-auth-wrapper {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }
    .auth-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 24px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(226, 232, 240, 0.4);
        width: 100%;
        max-width: 440px;
        padding: 40px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-sizing: border-box;
    }
    .auth-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
    }
    .auth-header {
        text-align: center;
        margin-bottom: 32px;
    }
    .auth-logo {
        height: 60px;
        margin-bottom: 20px;
    }
    .auth-header h1 {
        font-size: 26px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 8px 0;
    }
    .auth-header p {
        font-size: 15px;
        color: #64748b;
        margin: 0;
    }
    .form-group {
        margin-bottom: 22px;
        text-align: left;
    }
    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
    }
    .form-control-input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #cbd5e1;
        border-radius: 12px;
        font-size: 15px;
        color: #1e293b;
        background: #f8fafc;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }
    .form-control-input:focus {
        border-color: #273c8e;
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(39, 60, 142, 0.1);
    }
    .password-input-wrapper {
        position: relative;
        width: 100%;
    }
    .password-toggle {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        cursor: pointer;
        transition: color 0.2s;
    }
    .password-toggle:hover {
        color: #273c8e;
    }
    .btn-submit {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #273c8e 0%, #1e2e6d 100%);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 10px 20px -5px rgba(39, 60, 142, 0.3);
        transition: all 0.3s ease;
        margin-top: 15px;
    }
    .btn-submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 15px 25px -5px rgba(39, 60, 142, 0.4);
    }
    .btn-submit:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        box-shadow: none;
    }
    .custom-alert {
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 20px;
        line-height: 1.5;
        border: 1px solid transparent;
        display: none;
        align-items: center;
        gap: 8px;
        text-align: left;
    }
    .alert-danger-custom {
        color: #991b1b;
        background: #fef2f2;
        border-color: #fca5a5;
        display: none;
    }
    .alert-success-custom {
        color: #065f46;
        background: #ecfdf5;
        border-color: #a7f3d0;
        display: none;
    }
  </style>
</head>
<body>
  <div class="premium-auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/">
          <img src="{{ app_url }}/static/img/logo.png" class="auth-logo" alt="PadosiAgent Logo" onerror="this.src='https://padosiagents.com/img/logo.png'">
        </a>
        <h1>Reset Password</h1>
        <p>Please enter your new password below.</p>
      </div>

      <!-- Alert Containers -->
      <div id="alert-error" class="custom-alert alert-danger-custom">
        <i class="fas fa-exclamation-circle"></i>
        <div id="error-message"></div>
      </div>
      <div id="alert-success" class="custom-alert alert-success-custom">
        <i class="fas fa-check-circle"></i>
        <div id="success-message"></div>
      </div>

      <form id="reset-password-form">
        <input type="hidden" name="token" value="{{ token }}">
        <input type="hidden" name="login_type" value="{{ login_type }}">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control-input" value="{{ email }}" required readonly style="background-color: #f1f5f9; color: #475569; cursor: not-allowed;">
        </div>

        <div class="form-group">
          <label for="password">New Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" name="password" class="form-control-input" placeholder="••••••••" required autofocus>
            <i class="fas fa-eye password-toggle" onclick="togglePasswordVisibility('password')"></i>
          </div>
          <small style="color: #64748b; font-size: 12px; margin-top: 4px; display: block;">Minimum 8 characters with letters, numbers, and symbols</small>
        </div>

        <div class="form-group">
          <label for="password_confirmation">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password_confirmation" name="password_confirmation" class="form-control-input" placeholder="••••••••" required>
            <i class="fas fa-eye password-toggle" onclick="togglePasswordVisibility('password_confirmation')"></i>
          </div>
          <div id="password-match-error" style="color: #ef4444; font-size: 13px; margin-top: 5px; display: none;">
            Passwords do not match.
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span id="btn-text">Reset Password</span>
          <i class="fas fa-lock" id="btn-icon"></i>
          <i class="fas fa-spinner fa-spin" id="btn-spinner" style="display: none;"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(fieldId) {
      const input = document.getElementById(fieldId);
      const icon = input.nextElementSibling;
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('password_confirmation');
    const matchError = document.getElementById('password-match-error');
    const errorAlert = document.getElementById('alert-error');
    const errorMessage = document.getElementById('error-message');
    const successAlert = document.getElementById('alert-success');
    const successMessage = document.getElementById('success-message');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    const btnSpinner = document.getElementById('btn-spinner');

    // Real-time matching check
    confirmInput.addEventListener('input', function() {
        if (this.value && passwordInput.value !== this.value) {
            matchError.style.display = 'block';
            this.style.borderColor = '#ef4444';
        } else {
            matchError.style.display = 'none';
            this.style.borderColor = '';
        }
    });

    function showError(msg) {
        errorAlert.style.display = 'flex';
        errorMessage.innerHTML = msg;
        successAlert.style.display = 'none';
    }

    function showSuccess(msg) {
        successAlert.style.display = 'flex';
        successMessage.innerHTML = msg;
        errorAlert.style.display = 'none';
    }

    function resetButton() {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnIcon.style.display = 'inline';
        btnSpinner.style.display = 'none';
    }

    const form = document.getElementById('reset-password-form');
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Final password match validation
        if (passwordInput.value !== confirmInput.value) {
            showError("Passwords do not match.");
            return;
        }

        // Show spinner and disable button
        submitBtn.disabled = true;
        btnText.style.display = 'none';
        btnIcon.style.display = 'none';
        btnSpinner.style.display = 'inline-block';
        errorAlert.style.display = 'none';
        
        try {
            const response = await fetch('/api/v1/agents/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    token: document.getElementsByName('token')[0].value,
                    email: document.getElementsByName('email')[0].value,
                    password: passwordInput.value,
                    password_confirmation: confirmInput.value,
                    login_type: document.getElementsByName('login_type')[0].value
                })
            });
            
            const result = await response.json();
            
            if (response.ok && result.success) {
                showSuccess(result.message || "Your password has been reset successfully! Please log in.");
                setTimeout(() => {
                    const loginType = document.getElementsByName('login_type')[0].value;
                    if (loginType === 'distributor') {
                        window.location.href = '/distributor-login';
                    } else {
                        window.location.href = '/agent-login';
                    }
                }, 2000);
            } else {
                // If validation failed or token invalid
                let errText = "An error occurred.";
                if (result.errors && typeof result.errors === 'object') {
                    const errs = [];
                    for (const field in result.errors) {
                        if (Array.isArray(result.errors[field])) {
                            errs.push(...result.errors[field]);
                        } else {
                            errs.push(result.errors[field]);
                        }
                    }
                    if (errs.length > 0) {
                        errText = errs.join("<br>");
                    } else if (result.message) {
                        errText = result.message;
                    }
                } else if (result.message) {
                    errText = result.message;
                } else if (result.detail) {
                    if (Array.isArray(result.detail)) {
                        errText = result.detail.map(d => d.msg || d.message).join("<br>");
                    } else if (typeof result.detail === 'object') {
                        errText = result.detail.message || JSON.stringify(result.detail);
                    } else {
                        errText = result.detail;
                    }
                }
                showError(errText);
                resetButton();
            }
        } catch (err) {
            showError("Failed to communicate with server. Please try again.");
            resetButton();
        }
    });
  </script>
</body>
</html>
