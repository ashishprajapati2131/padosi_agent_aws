{% if site_banner and site_banner.is_active %}
<div id="padosiTopAnnouncementBar" class="padosi-announcement-bar" style="
    background: {{ site_banner.bg_color|default:'linear-gradient(135deg, #059669 0%, #10b981 100%)' }};
    color: {{ site_banner.text_color|default:'#ffffff' }};
    display: none;
">
    <div class="container-fluid px-3 px-md-4">
        <div class="d-flex align-items-center justify-content-between py-2 gap-2">
            <div class="d-flex align-items-center flex-grow-1 justify-content-center text-center gap-2">
                <span class="announcement-text fw-medium" style="font-size: 13.5px; line-height: 1.35;">
                    {{ site_banner.message|safe }}
                </span>
                {% if site_banner.btn_text and site_banner.btn_url %}
                <a href="{{ site_banner.btn_url }}" class="btn btn-sm announcement-btn text-nowrap rounded-pill px-3 ms-2 shadow-xs fw-bold">
                    {{ site_banner.btn_text }} <i class="fa-solid fa-arrow-right ms-1" style="font-size: 11px;"></i>
                </a>
                {% endif %}
            </div>
            {% if site_banner.is_dismissible %}
            <button type="button" class="announcement-close-btn" onclick="dismissPadosiBanner()" aria-label="Close Announcement">
                <i class="fa-solid fa-xmark"></i>
            </button>
            {% endif %}
        </div>
    </div>
</div>

<style>
.padosi-announcement-bar {
    position: relative;
    z-index: 1060;
    font-family: 'Outfit', system-ui, sans-serif;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
}
.announcement-btn {
    background: #ffffff !important;
    color: #0f172a !important;
    font-size: 12px !important;
    padding: 3px 14px !important;
    border: none !important;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.announcement-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}
.announcement-close-btn {
    background: transparent;
    border: none;
    color: inherit;
    opacity: 0.8;
    padding: 4px 8px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, background-color 0.2s ease;
}
.announcement-close-btn:hover {
    opacity: 1;
    background: rgba(0, 0, 0, 0.1);
}
@media (max-width: 767.98px) {
    .announcement-text {
        font-size: 12px !important;
    }
    .announcement-btn {
        font-size: 11px !important;
        padding: 2px 10px !important;
    }
}
</style>

<script>
(function() {
    try {
        var isDismissed = sessionStorage.getItem('padosi_banner_dismissed');
        if (!isDismissed) {
            var bar = document.getElementById('padosiTopAnnouncementBar');
            if (bar) bar.style.display = 'block';
        }
    } catch(e) {}
})();

function dismissPadosiBanner() {
    var bar = document.getElementById('padosiTopAnnouncementBar');
    if (bar) {
        bar.style.opacity = '0';
        bar.style.transform = 'translateY(-100%)';
        setTimeout(function() { bar.style.display = 'none'; }, 300);
        try {
            sessionStorage.setItem('padosi_banner_dismissed', '1');
        } catch(e) {}
    }
}
</script>
{% endif %}
