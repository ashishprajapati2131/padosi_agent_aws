<div class="keyword-row row g-2 align-items-start border-bottom pb-2 mb-2">
    <div class="col-md-3">
        <input type="text" name="keyword" value="{{ rule.keyword|default:'' }}" maxlength="100" class="form-control form-control-sm" placeholder="Keyword, e.g. price" aria-label="Keyword">
    </div>
    <div class="col-md-2">
        <select name="match" class="form-select form-select-sm" aria-label="Match type">
            <option value="exact" {% if rule.match != 'contains' %}selected{% endif %}>Exact</option>
            <option value="contains" {% if rule.match == 'contains' %}selected{% endif %}>Contains</option>
        </select>
        <select name="active" class="form-select form-select-sm mt-1" aria-label="Status">
            <option value="1" {% if not rule or rule.active %}selected{% endif %}>Active</option>
            <option value="0" {% if rule and not rule.active %}selected{% endif %}>Off</option>
        </select>
    </div>
    <div class="col-md-6">
        <textarea name="reply" rows="2" maxlength="3000" class="form-control form-control-sm" placeholder="Reply sent to the user" aria-label="Reply">{{ rule.reply|default:'' }}</textarea>
    </div>
    <div class="col-md-1 text-end">
        <button type="button" class="btn btn-sm btn-light border text-danger" onclick="removeKeywordRow(this)" title="Remove" aria-label="Remove keyword">
            <i class="fa-solid fa-trash"></i>
        </button>
    </div>
</div>
