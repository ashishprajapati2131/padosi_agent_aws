{% load json_tags static %}
{% if admin_lock_preview %}
<link rel="stylesheet" href="{% static 'admin_panel/inline/content/_manage_agent_chrome.1.css' %}">
<script src="{% static 'admin_panel/inline/content/_manage_agent_chrome.1.js' %}"></script>
<div class="manage-agent-chrome">
    <div class="manage-agent-chrome-inner">
        <div>
            <a href="{% url 'admin_content_plans' %}" style="font-size:13px;font-weight:700;color:#0284c7;text-decoration:none;">
                <i class="fas fa-arrow-left me-1"></i> Back to Plans
            </a>
            <div style="font-size:15px;font-weight:800;color:#0f172a;">{{ preview_plan_label }} — sample layout, not a real agent</div>
        </div>
        <div class="manage-agent-tabs">
            <a class="manage-agent-tab {% if preview_tab == 'dashboard' %}active{% endif %}" href="{% url 'admin_content_plans_manage_agent' plan_slug=preview_plan_slug %}?tab=dashboard">Dashboard</a>
            <a class="manage-agent-tab {% if preview_tab == 'edit_profile' %}active{% endif %}" href="{% url 'admin_content_plans_manage_agent' plan_slug=preview_plan_slug %}?tab=edit_profile">Edit Profile</a>
            <a class="manage-agent-tab {% if preview_tab == 'other' %}active{% endif %}" href="{% url 'admin_content_plans_manage_agent' plan_slug=preview_plan_slug %}?tab=other">Other features</a>
        </div>
    </div>
</div>
<div class="manage-agent-overlay" id="manageAgentLockModal">
    <div class="manage-agent-dialog" role="dialog" aria-modal="true" aria-labelledby="manageAgentLockTitle">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e2e8f0;">
            <h5 class="modal-title fw-bold mb-0" id="manageAgentLockTitle" style="font-size:16px;">Lock feature</h5>
            <button type="button" class="manage-agent-overlay-close" aria-label="Close" style="background:none;border:none;font-size:22px;line-height:1;color:#64748b;">&times;</button>
        </div>
        <div style="padding:20px;">
            <p class="text-muted mb-3" id="manageAgentLockCopy" style="font-size:13px;"></p>
            <div id="manageAgentLockOptions">
                <label class="d-block mb-2" style="font-size:13px;font-weight:600;">
                    <input type="radio" name="manage_agent_add_condition" value="no" checked> Lock only
                </label>
                <label class="d-block mb-3" style="font-size:13px;font-weight:600;">
                    <input type="radio" name="manage_agent_add_condition" value="yes"> Lock and add unlock condition
                </label>
                <div id="manageAgentConditionBox" style="display:none;">
                    <label class="form-label fw-bold mb-1" style="font-size:12px;">Match</label>
                    <div id="manageAgentMatch" class="ma-dd" data-value="all">
                        <button type="button" class="ma-dd-toggle">All conditions (AND)</button>
                        <div class="ma-dd-menu">
                            <button type="button" class="ma-dd-option is-selected" data-value="all">All conditions (AND)</button>
                            <button type="button" class="ma-dd-option" data-value="any">Any condition (OR)</button>
                        </div>
                    </div>
                    <label class="form-label fw-bold mb-2 mt-3" style="font-size:12px;">Conditions</label>
                    <div id="manageAgentConditions"></div>
                    <button type="button" class="btn btn-sm btn-outline-success" id="manageAgentAddCond">
                        <i class="fas fa-plus me-1"></i> Add condition
                    </button>
                </div>
            </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 20px;border-top:1px solid #e2e8f0;">
            <button type="button" class="btn btn-light manage-agent-overlay-close">Cancel</button>
            <button type="button" class="btn text-white" id="manageAgentLockConfirm" style="background:#0284c7;border-color:#0284c7;font-weight:700;">Save</button>
        </div>
    </div>
</div>
<script>
window.MANAGE_AGENT = {
    planSlug: "{{ preview_plan_slug|escapejs }}",
    planLabel: "{{ preview_plan_label|escapejs }}",
    toggleUrl: "{% url 'admin_content_plans_manage_agent_toggle' plan_slug=preview_plan_slug %}",
    csrfToken: "{{ csrf_token }}",
    csrfCookieName: "padosi_csrf_token",
    enabled: {{ preview_enabled_features_json|safe_json:"[]" }},
    labels: {{ preview_feature_labels_json|safe_json:"{}" }},
    builder: {{ preview_unlock_builder_json|safe_json:"{}" }}
};
</script>
{% endif %}
