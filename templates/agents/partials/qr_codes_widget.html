{% if qr_service_enabled and qr_items %}
<div class="pa-qr-dock pa-qr-section">
    <div class="pa-qr-dock-intro">
        <span class="pa-qr-dock-badge"><i class="fas fa-qrcode"></i> Share QR</span>
        <strong>Your QR Codes</strong>
        <span>Profile, visiting card, and reviews — scan, download, or share</span>

        <!-- Side-by-Side Action Buttons on Mobile and Desktop -->
        <style>
            .pa-qr-header-actions {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: nowrap !important;
                align-items: center !important;
                gap: 8px !important;
                margin-top: 10px !important;
                width: 100% !important;
                max-width: 480px !important;
            }
            .pa-qr-btn-pill {
                flex: 1 1 0 !important;
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                text-align: center !important;
                white-space: nowrap !important;
                border-radius: 999px !important;
                font-weight: 700 !important;
                font-size: clamp(10.5px, 2.8vw, 13px) !important;
                padding: 8px 12px !important;
                text-decoration: none !important;
                box-sizing: border-box !important;
                line-height: 1.2 !important;
                min-height: 36px !important;
                cursor: pointer !important;
                transition: all 0.15s ease !important;
            }
            .pa-qr-btn-card {
                background: #0b1f4d !important;
                color: #ffffff !important;
                border: none !important;
            }
            .pa-qr-btn-card:hover {
                background: #071536 !important;
                color: #ffffff !important;
                transform: translateY(-1px) !important;
            }
            .pa-qr-btn-studio {
                background: linear-gradient(135deg, #0d9488 0%, #1e40af 100%) !important;
                color: #ffffff !important;
                border: none !important;
                box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15) !important;
            }
            .pa-qr-btn-studio:hover {
                background: linear-gradient(135deg, #0f766e 0%, #1e3a8a 100%) !important;
                color: #ffffff !important;
                transform: translateY(-1px) !important;
            }
            @media (max-width: 480px) {
                .pa-qr-header-actions {
                    gap: 6px !important;
                }
                .pa-qr-btn-pill {
                    padding: 7px 8px !important;
                    font-size: 11px !important;
                    min-height: 34px !important;
                }
            }
        </style>
        <div class="pa-qr-header-actions">
            {% if agent.agent_slug %}
            <a class="btn btn-sm pa-qr-btn-pill pa-qr-btn-card" href="{% url 'agents:agent_review_card' slug=agent.agent_slug %}">
                Open Review Card
            </a>
            {% endif %}
            <button type="button" class="btn btn-sm pa-qr-btn-pill pa-qr-btn-studio" onclick="window.openInviteStudio ? window.openInviteStudio() : $('#reviewShareModal').modal('show')">
                <i class="fas fa-paper-plane" style="color:#fbbf24; margin-right:4px;"></i> Share &amp; Invite Studio
            </button>
        </div>
    </div>
    <div class="pa-qr-dock-row">
        {% for item in qr_items %}
        <div class="pa-qr-mini pa-qr-mini--{{ item.type }}">
            <div class="pa-qr-mini-accent" aria-hidden="true"></div>
            <div class="pa-qr-hover">
                <img src="{{ item.preview_url }}" alt="{{ item.label }} QR code" class="pa-qr-mini-img" loading="lazy">
                <div class="pa-qr-hover-actions">
                    <button type="button" class="pa-qr-chip pa-qr-view-btn" title="View" aria-label="View {{ item.label }} QR"
                        data-src="{{ item.preview_url }}" data-label="{{ item.label }}">
                        <i class="fas fa-eye"></i>
                    </button>
                    {% if qr_allow_download %}
                    <a class="pa-qr-chip" href="{{ item.download_url }}" title="Download" aria-label="Download {{ item.label }} QR">
                        <i class="fas fa-download"></i>
                    </a>
                    {% endif %}
                    <button type="button" class="pa-qr-chip pa-qr-share-btn" title="Share &amp; Invite Studio" aria-label="Share {{ item.label }} QR"
                        data-type="{{ item.type }}" data-url="{{ item.target_url }}" data-label="{{ item.label }}">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
            </div>
            <div class="pa-qr-mini-foot">
                <span class="pa-qr-mini-label">{{ item.label }}</span>
                <div class="pa-qr-mini-social">
                    <a class="pa-fab pa-fab-wa" href="{{ item.whatsapp_url }}" target="_blank" rel="noopener" title="Share on WhatsApp" aria-label="Share {{ item.label }} on WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                    <button type="button" class="pa-fab pa-fab-ig pa-ig-copy" data-copy="{{ item.target_url }}" title="Copy link for Instagram" aria-label="Copy {{ item.label }} link for Instagram">
                        <i class="fab fa-instagram"></i>
                    </button>
                    <a class="pa-fab pa-fab-fb" href="{{ item.facebook_url }}" target="_blank" rel="noopener" title="Share on Facebook" aria-label="Share {{ item.label }} on Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div class="modal fade pa-qr-preview-modal" id="qrPreviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered pa-qr-preview-dialog">
        <div class="modal-content pa-qr-preview-content">
            <button type="button" class="pa-qr-preview-close" data-dismiss="modal" data-bs-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
            <img id="qrPreviewImg" src="" alt="QR code" class="pa-qr-preview-img">
        </div>
    </div>
</div>
<script>
(function() {
    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve();
    }
    function toast(msg) {
        if (typeof Swal !== 'undefined') {
            Swal.fire({ toast: true, position: 'top-end', timer: 2200, showConfirmButton: false, icon: 'success', title: msg });
        } else {
            alert(msg);
        }
    }
    function openPreview(src, label) {
        var img = document.getElementById('qrPreviewImg');
        if (img) {
            img.src = src || '';
            img.alt = (label || 'QR code') + ' — PadosiAgent';
        }
        var el = document.getElementById('qrPreviewModal');
        if (!el) return;
        document.body.classList.add('pa-qr-preview-open');
        if (typeof $ !== 'undefined' && $.fn.modal) {
            $('#qrPreviewModal').modal('show');
        } else if (typeof bootstrap !== 'undefined') {
            new bootstrap.Modal(el).show();
        }
    }
    var previewModal = document.getElementById('qrPreviewModal');
    if (previewModal) {
        previewModal.addEventListener('hidden.bs.modal', function() {
            document.body.classList.remove('pa-qr-preview-open');
        });
        if (typeof $ !== 'undefined' && $.fn.modal) {
            $(previewModal).on('hidden.bs.modal', function() {
                document.body.classList.remove('pa-qr-preview-open');
            });
        }
    }
    document.querySelectorAll('.pa-qr-dock .pa-qr-view-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            openPreview(btn.getAttribute('data-src'), btn.getAttribute('data-label'));
        });
    });

    function openStudioFromQR(mode) {
        if (window.openInviteStudio) {
            window.openInviteStudio(mode);
        } else if (typeof $ !== 'undefined' && $.fn.modal) {
            $('#reviewShareModal').modal('show');
        } else if (typeof bootstrap !== 'undefined') {
            new bootstrap.Modal(document.getElementById('reviewShareModal')).show();
        }
    }

    // Share button opens Invite Studio with matching mode
    document.querySelectorAll('.pa-qr-dock .pa-qr-share-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            var type = btn.getAttribute('data-type') || '';
            var mode = (type === 'reviews') ? 'review' : 'social';
            openStudioFromQR(mode);
        });
    });

    // Social icons inside QR mini cards also open Invite Studio
    document.querySelectorAll('.pa-qr-dock .pa-qr-mini-social a, .pa-qr-dock .pa-qr-mini-social button').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            var card = btn.closest('.pa-qr-mini');
            var isReview = card && card.classList.contains('pa-qr-mini--reviews');
            var mode = isReview ? 'review' : 'social';
            openStudioFromQR(mode);
        });
    });
})();
</script>
{% endif %}
