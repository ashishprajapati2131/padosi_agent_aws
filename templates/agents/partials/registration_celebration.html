<div class="reg-celebration-overlay" id="regCelebrationOverlay" aria-hidden="true" role="dialog" aria-labelledby="regCelebrationTitle" aria-modal="true">
    <div class="reg-celebration-overlay__backdrop" aria-hidden="true"></div>
    <div class="reg-celebration-overlay__confetti" id="regCelebrationConfetti" aria-hidden="true"></div>
    <div class="reg-celebration-overlay__stars" id="regCelebrationStars" aria-hidden="true"></div>
    <div class="reg-celebration-overlay__spark-field" id="regCelebrationSparkField" aria-hidden="true"></div>

    <div class="reg-celebration-stage">
        <div class="reg-celebration-overlay__burst" aria-hidden="true"></div>

        <div class="reg-sparkler reg-sparkler--left" aria-hidden="true">
            <span class="reg-sparkler-stick"></span>
            <span class="reg-sparkler-ember"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--streak"></span>
            <span class="reg-spark reg-spark--streak"></span>
            <span class="reg-spark reg-spark--streak"></span>
            <span class="reg-spark reg-spark--large"></span>
        </div>

        <div class="reg-celebration-card">
            <p class="reg-celebration-kicker" id="regCelebrationTitle">Congratulations</p>
            <h2 class="reg-celebration-name" id="regCelebrationName"></h2>
            <p class="reg-celebration-msg" id="regCelebrationMsg">Payment successful! Your account is activated.</p>
            <p class="reg-celebration-next" id="regCelebrationNext">Taking you to your dashboard…</p>
        </div>

        <div class="reg-sparkler reg-sparkler--right" aria-hidden="true">
            <span class="reg-sparkler-stick"></span>
            <span class="reg-sparkler-ember"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--static"></span>
            <span class="reg-spark reg-spark--streak"></span>
            <span class="reg-spark reg-spark--streak"></span>
            <span class="reg-spark reg-spark--streak"></span>
            <span class="reg-spark reg-spark--large"></span>
        </div>
    </div>
</div>
