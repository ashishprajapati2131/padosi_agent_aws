[project]
name = "google-places-collector"
version = "1.0.0"
description = "Generic Google Places Data Collector API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
