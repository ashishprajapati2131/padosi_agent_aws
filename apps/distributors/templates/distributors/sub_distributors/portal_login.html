<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Distributor Login | PadosiAgent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .auth-card { max-width: 400px; margin: 60px auto; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: none; }
        .auth-header { background: #0f172a; color: white; border-radius: 16px 16px 0 0; padding: 30px; text-align: center; }
        .btn-primary { background: #3b82f6; border: none; padding: 12px; font-weight: 600; }
        .btn-primary:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card auth-card">
            <div class="auth-header">
                <h4 class="fw-bold mb-1">Sub-Distributor Portal</h4>
                <p class="mb-0 opacity-75" style="font-size: 14px;">Log in to manage your agent network</p>
            </div>
            <div class="card-body p-4">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" style="font-size: 14px;" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold" style="font-size: 12px;">Email or Mobile Number</label>
                        <input type="text" name="identifier" class="form-control bg-light" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold" style="font-size: 12px;">Password</label>
                        <input type="password" name="password" class="form-control bg-light" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-3">Sign In</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
