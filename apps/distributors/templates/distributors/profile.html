{% extends 'distributors/layout.html' %}

{% block page_title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        
        <div class="card p-5 border-0 shadow-sm">
            <h5 class="fw-bold mb-4 border-bottom pb-3">
                <i class="fa-solid fa-user-circle text-primary me-2"></i> Account Information
            </h5>

            <form action="{% url 'distributors:profile_update' %}" method="POST">
                {% csrf_token %}
                
                <div class="row g-4 mb-5">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted">Full Name</label>
                        <input type="text" name="fullname" class="form-control py-2" value="{{ user.first_name }}" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted">Email Address</label>
                        <input type="email" name="email" class="form-control py-2" value="{{ user.email }}" required>
                    </div>
                </div>

                <h5 class="fw-bold mb-4 border-bottom pb-3">
                    <i class="fa-solid fa-lock text-primary me-2"></i> Change Password
                </h5>
                <p class="text-muted small mb-4">Leave the password fields blank if you do not want to change your current password.</p>

                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label fw-bold small text-muted">Current Password</label>
                        <input type="password" name="current_password" class="form-control py-2" placeholder="Enter current password">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted">New Password</label>
                        <input type="password" name="password" class="form-control py-2" placeholder="Enter new password">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted">Confirm New Password</label>
                        <input type="password" name="password_confirmation" class="form-control py-2" placeholder="Confirm new password">
                    </div>
                </div>

                <div class="mt-5 text-end">
                    <button type="submit" class="btn btn-primary px-4 shadow-sm" style="background: #10b981;">
                        <i class="fa-solid fa-save me-2"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
