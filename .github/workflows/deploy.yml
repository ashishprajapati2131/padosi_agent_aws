name: Deploy Django to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Queue deploys instead of running two against the server at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Restrict the default GITHUB_TOKEN to the minimum required scope.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          # Reuse downloaded wheels between runs; refreshed whenever requirements.txt changes.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # tblib lets parallel test workers report failure tracebacks (CI only, not a production dependency).
          pip install --disable-pip-version-check -r requirements.txt tblib

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: padosi_agent.settings
          SECRET_KEY: ci-check-only
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: |
          python manage.py check

      # Tests run on in-memory SQLite (apps.home.test_runner), no MySQL needed.
      # Blocking release gate: if any test fails, deployment halts immediately.
      - name: Run test suite
        env:
          DJANGO_SETTINGS_MODULE: padosi_agent.settings
          SECRET_KEY: ci-check-only
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: |
          # One worker per runner CPU; each worker gets its own in-memory SQLite database.
          python manage.py test apps fastapi_app --noinput --parallel auto

      - name: Deploy to GoDaddy via SSH
        env:
          GODADDY_HOST: ${{ secrets.GODADDY_HOST }}
          GODADDY_USER: ${{ secrets.GODADDY_USERNAME }}
          GODADDY_KEY: ${{ secrets.GODADDY_SSH_KEY }}
          GODADDY_PORT: ${{ secrets.GODADDY_PORT || '22' }}
          PROJECT_PATH: ${{ secrets.GODADDY_PROJECT_PATH }}
        run: |
          # 1. Ensure clean Unix line endings on deployment script
          sed -i 's/\r$//' scripts/deploy_godaddy.sh scripts/rollback_godaddy.sh scripts/verify_health_ssh.sh
          chmod +x scripts/deploy_godaddy.sh scripts/rollback_godaddy.sh scripts/verify_health_ssh.sh

          # 2. Setup SSH directory and private key
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$GODADDY_PORT" -H "$GODADDY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts 2>/dev/null || true
          echo "$GODADDY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          if [ -n "$(tail -c 1 ~/.ssh/deploy_key)" ]; then
            echo "" >> ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/deploy_key; then
            SSH_KEY_FILE=~/.ssh/deploy_key
          else
            cp ~/.ssh/deploy_key ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            SSH_KEY_FILE=~/.ssh/id_rsa
          fi
          echo "SSH_KEY_FILE=$SSH_KEY_FILE" >> "$GITHUB_ENV"

          # 3. Execute deployment, retrying only SSH connection failures (exit 255).
          # Any other exit code is the script itself failing (backup, migrate, ...):
          # re-running it would just repeat migrate against a half-migrated DB.
          MAX_ATTEMPTS=3
          ATTEMPT=1
          DEPLOY_SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "===================================================="
            echo " [Attempt $ATTEMPT of $MAX_ATTEMPTS] Connecting to $GODADDY_USER@$GODADDY_HOST:$GODADDY_PORT"
            echo "===================================================="

            if ssh -i "$SSH_KEY_FILE" \
                -p "$GODADDY_PORT" \
                -o StrictHostKeyChecking=accept-new \
                -o IdentitiesOnly=yes \
                -o HostkeyAlgorithms=+ssh-rsa,ssh-ed25519 \
                -o PubkeyAcceptedAlgorithms=+ssh-rsa,ssh-ed25519 \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=10 \
                -o ConnectTimeout=45 \
                -o BatchMode=yes \
                "$GODADDY_USER@$GODADDY_HOST" "bash -se -- \"$PROJECT_PATH\" \"$GODADDY_USER\"" < scripts/deploy_godaddy.sh
            then
              DEPLOY_SUCCESS=1
              echo "==> Deployment successfully finished on attempt $ATTEMPT."
              break
            else
              EXIT_CODE=$?
              echo "==> Attempt $ATTEMPT failed with exit code $EXIT_CODE."
              if [ $EXIT_CODE -ne 255 ]; then
                echo "==> The deploy script itself failed (not the SSH connection): not retrying."
                break
              fi
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "==> Waiting 10 seconds before retrying..."
                sleep 10
              fi
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          if [ $DEPLOY_SUCCESS -ne 1 ]; then
            echo "==> ERROR: Deployment to GoDaddy failed (attempt $ATTEMPT of $MAX_ATTEMPTS)."
            exit 1
          fi

      - name: Health check (roll back on failure)
        env:
          GODADDY_HOST: ${{ secrets.GODADDY_HOST }}
          GODADDY_USER: ${{ secrets.GODADDY_USERNAME }}
          GODADDY_PORT: ${{ secrets.GODADDY_PORT || '22' }}
          PROJECT_PATH: ${{ secrets.GODADDY_PROJECT_PATH }}
        run: |
          # Cloudflare Bot Fight Mode blocks ALL GitHub Actions datacenter IPs
          # regardless of User-Agent (always returns 403).
          # The ONLY reliable approach: SSH into the origin server directly.
          sleep 3
          echo "==> Verifying server health via SSH (bypasses Cloudflare)..."
          if ssh -i "$SSH_KEY_FILE" \
              -p "$GODADDY_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o HostkeyAlgorithms=+ssh-rsa,ssh-ed25519 \
              -o PubkeyAcceptedAlgorithms=+ssh-rsa,ssh-ed25519 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o ConnectTimeout=45 \
              -o BatchMode=yes \
              "$GODADDY_USER@$GODADDY_HOST" "bash -se -- \"$PROJECT_PATH\"" < scripts/verify_health_ssh.sh; then
            echo "==> Health check PASSED (Database OK, Cache OK, Django OK)."
            exit 0
          fi
          echo "==> ERROR: Server health check failed after deploy. Rolling back..."
          ssh -i "$SSH_KEY_FILE" \
              -p "$GODADDY_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o HostkeyAlgorithms=+ssh-rsa,ssh-ed25519 \
              -o PubkeyAcceptedAlgorithms=+ssh-rsa,ssh-ed25519 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o ConnectTimeout=45 \
              -o BatchMode=yes \
              "$GODADDY_USER@$GODADDY_HOST" "cd \"$PROJECT_PATH\" && PROJECT_DIR=\"$PROJECT_PATH\" bash -se" < scripts/rollback_godaddy.sh \
            || echo "==> ERROR: rollback script failed too; roll back by hand over SSH."
          exit 1

      - name: Verify production OG meta (post-deploy)
        if: success()
        env:
          GODADDY_HOST: ${{ secrets.GODADDY_HOST }}
          GODADDY_USER: ${{ secrets.GODADDY_USERNAME }}
          GODADDY_PORT: ${{ secrets.GODADDY_PORT || '22' }}
          PROJECT_PATH: ${{ secrets.GODADDY_PROJECT_PATH }}
        run: |
          # Use SSH + curl on localhost to bypass Cloudflare for OG meta check too
          OG_CHECK=$(ssh -i "$SSH_KEY_FILE" \
              -p "$GODADDY_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$GODADDY_USER@$GODADDY_HOST" "cd \"$PROJECT_PATH\" && curl -sS http://localhost:${PASSENGER_PORT:-3000}/gj/rashmi-pravinbhai-wagheshwari-1/ 2>/dev/null || echo '__CURL_FAILED__'")
          if echo "$OG_CHECK" | grep -q '__CURL_FAILED__'; then
            echo "==> WARNING: Could not fetch OG page via localhost; skipping OG meta verification."
            exit 0
          fi
          echo "$OG_CHECK" | grep -q '&#8203;' && { echo 'ERROR: zero-width og:description still present'; exit 1; } || true
          echo "==> Production OG meta verification passed."

