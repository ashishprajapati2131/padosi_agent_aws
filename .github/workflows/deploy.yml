name: Deploy Django to GoDaddy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: padosi_agent.settings
          SECRET_KEY: ci-check-only
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: |
          python manage.py check

      - name: Deploy to GoDaddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GODADDY_HOST }}
          username: ${{ secrets.GODADDY_USERNAME }}
          key: ${{ secrets.GODADDY_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.GODADDY_PROJECT_PATH }}

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            /home/m69qf6gyhm3n/virtualenv/padosiagentdjango/src/3.11/bin/pip install -r requirements.txt

            echo "Running migrations..."
            /home/m69qf6gyhm3n/virtualenv/padosiagentdjango/src/3.11/bin/python manage.py migrate --noinput

            echo "Collecting static files..."
            /home/m69qf6gyhm3n/virtualenv/padosiagentdjango/src/3.11/bin/python manage.py collectstatic --noinput

            echo "Restarting Passenger..."
            mkdir -p tmp
            touch tmp/restart.txt

            echo "Deployment completed successfully!"